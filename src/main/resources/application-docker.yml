spring:
  datasource:
    url: jdbc:postgresql://db-main:5432/examinai-main
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: false
#    driver-class-name: org.postgresql.Driver
  jpa:
    properties.hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      show_sql: true
      format_sql: true
